name: Brain rules

on:
  push:
    branches: [main]
    paths: ['brain/rules.json', 'app/src/main/assets/yt_rules.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"

      - name: Sign brain rules
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -importkeystore -srckeystore "$KEYSTORE_PATH" -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/brain.p12" -deststoretype PKCS12 -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" -noprompt
          openssl pkcs12 -in "$RUNNER_TEMP/brain.p12" -nodes -nocerts -passin env:KEYSTORE_PASSWORD -out "$RUNNER_TEMP/brain.pem"
          openssl pkey -in "$RUNNER_TEMP/brain.pem" -pubout -outform DER | base64 -w0 > app/src/main/assets/brain.pub
          mkdir -p dist
          cp brain/rules.json dist/rules.json
          openssl dgst -sha256 -sign "$RUNNER_TEMP/brain.pem" -out "$RUNNER_TEMP/brain.bin" dist/rules.json
          base64 -w0 "$RUNNER_TEMP/brain.bin" > dist/rules.json.sig
          cp app/src/main/assets/yt_rules.json dist/yt_rules.json
          openssl dgst -sha256 -sign "$RUNNER_TEMP/brain.pem" -out "$RUNNER_TEMP/yt.bin" dist/yt_rules.json
          base64 -w0 "$RUNNER_TEMP/yt.bin" > dist/yt_rules.json.sig
          rm -f "$RUNNER_TEMP/brain.p12" "$RUNNER_TEMP/brain.pem" "$RUNNER_TEMP/brain.bin" "$RUNNER_TEMP/yt.bin"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: brain
          name: Brain rules
          prerelease: true
          make_latest: false
          files: |
            dist/rules.json
            dist/rules.json.sig
            dist/yt_rules.json
            dist/yt_rules.json.sig

      - name: Cleanup keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"
