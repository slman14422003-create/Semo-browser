org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
# AGP 9 جعل قواعد keep صارمة افتراضياً؛ نُبقي السلوك السابق لتفادي أعطال reflection في النسخة المنشورة (NewPipe/Rhino)
android.r8.strictFullModeForKeepRules=false

# ثبّت نسخة GeckoView برقم كامل من https://maven.mozilla.org/?prefix=maven2/org/mozilla/geckoview/geckoview-arm64-v8a/ (يمنع تغيّر البناء بين مرة وأخرى)
# geckoVersion=157.0.0.00000000000000

android.r8.optimizedResourceShrinking=true
